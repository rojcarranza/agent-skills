# Gates run locally (Actions is off, docs/workflow.md). Mac only.
# CI used Python 3.12, so every Python command runs under uv's 3.12. Windows
# (Git Bash) and Ubuntu run the suite by hand, see CLAUDE.md.
no_ci: true
allow_repo_commands: false
commands:
  lint: uv run --no-project --python 3.12 python tools/sync_shared.py --check
gates:
  - name: unittest-suite
    after: test
    command: >-
      uv run --no-project --python 3.12 --with python-pptx python -m unittest
      test_install test_skills
  - name: shared-files-in-sync
    after: test
    command: uv run --no-project --python 3.12 python tools/sync_shared.py --check
  - name: installer-smoke
    after: test
    # install.py into a scratch HOME with no cali on PATH; the real home is
    # never written. It writes the extras and no skills.
    command: |
      bash -c '
      set -euo pipefail
      base="$(mktemp -d)"; trap "rm -rf \"$base\"" EXIT
      mkdir -p "$base/home"
      export HOME="$base/home" USERPROFILE="$base/home"
      uv run --no-project --python 3.12 python install.py --skills-only
      for d in skills/*/; do
        n=$(basename "$d")
        test ! -e "$HOME/.copilot/skills/$n"
        test ! -e "$HOME/.claude/skills/$n"
      done
      test -f "$HOME/.copilot/instructions/personal.instructions.md"
      test -f "$HOME/.copilot/instructions/superpowers.instructions.md"
      grep -q "BEGIN agent-skills" "$HOME/.config/github-copilot/intellij/global-copilot-instructions.md"
      test ! -e "$HOME/.claude/rules/personal.md"
      cat > "$HOME/.claude.json" <<EOF
      {"mcpServers": {"github-mcp-server": {"type": "http", "url": "https://api.githubcopilot.com/mcp/"}, "neon": {"command": "x"}}}
      EOF
      mkdir -p "$HOME/.copilot"
      cat > "$HOME/.copilot/mcp-config.json" <<EOF
      {"mcpServers": {"github-mcp-server": {"type": "http", "url": "https://api.githubcopilot.com/mcp/", "tools": ["*"]}, "obsidian": {"command": "y"}}}
      EOF
      uv run --no-project --python 3.12 python install.py --skills-only
      ! grep -q github-mcp-server "$HOME/.claude.json"
      grep -q neon "$HOME/.claude.json"
      ! grep -q github-mcp-server "$HOME/.copilot/mcp-config.json"
      grep -q obsidian "$HOME/.copilot/mcp-config.json"
      '
  - name: skills-listing
    after: test
    command: |
      bash -c '
      set -euo pipefail
      NO_COLOR=1 npx -y skills@1.7.4 add . --list > "${TMPDIR:-/tmp}/skills-list.txt" 2>&1 || { cat "${TMPDIR:-/tmp}/skills-list.txt"; exit 1; }
      sed -E "s/\x1b\[[0-9;]*[A-Za-z]//g" "${TMPDIR:-/tmp}/skills-list.txt" > "${TMPDIR:-/tmp}/skills-list.clean"
      for d in skills/*/; do
        n=$(basename "$d")
        grep -qE "^[^a-zA-Z0-9]*${n}[[:space:]]*$" "${TMPDIR:-/tmp}/skills-list.clean" || { echo "$n not discovered"; exit 1; }
      done
      '
