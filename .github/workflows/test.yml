name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on windows-latest, the shell the VDI uses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: python -m unittest test_install
      - name: Skills follow the Agent Skills spec
        run: python -m unittest test_skills
      - name: Shared files are in sync
        run: python tools/sync_shared.py --check

  apm-smoke:
    # Real apm, scratch HOME: does apm.yml resolve from this clone?
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install apm
        run: python -m pip install apm-cli
      - name: install.py writes the user manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          token: placeholder   # the GitHub MCP server prompts for this; no TTY in CI
        run: |
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          python install.py --dry-run --skills-only
          python - <<'EOF'
          import install, pathlib
          install.write_user_manifest(install.render_user_manifest())
          print(pathlib.Path.home().joinpath(".apm", "apm.yml").read_text())
          EOF
      - name: apm resolves it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          token: placeholder   # the GitHub MCP server prompts for this; no TTY in CI
        run: |
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          cd "$HOME" && apm install -g --target claude,copilot --dry-run

  discoverable:
    # What `npx skills add rojcarranza/agent-skills` (skills.sh) will see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: skills CLI finds every skill
        run: |
          expected=$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)
          # NO_COLOR, then strip any ANSI codes left: the CLI colors skill names in CI.
          NO_COLOR=1 npx -y skills add . --list > raw.txt 2>&1 || { cat raw.txt; exit 1; }
          sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' raw.txt > list.txt
          cat list.txt
          for d in skills/*/; do
            name=$(basename "$d")
            # Match the CLI's header line for the skill (box-drawing prefix, then
            # the name alone): a substring or a mention inside another skill's
            # description, e.g. "use roj-code-review-pr instead", must not pass.
            grep -qE "^[^a-zA-Z0-9]*${name}[[:space:]]*$" list.txt \
              || { echo "::error::$name not discovered"; exit 1; }
          done
          echo "all $expected skills discovered"
