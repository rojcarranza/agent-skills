name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on windows-latest, the shell the VDI uses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: python -m unittest test_install
      - name: Skills follow the Agent Skills spec
        run: python -m unittest test_skills
      - name: roj-idea-to-project scripts
        run: python -m unittest test_idea_to_project
      - name: Shared files are in sync
        run: python tools/sync_shared.py --check

  cali-smoke:
    # Real cali, scratch HOME: install.py runs cali sync against this clone's
    # cali.yaml and cali.lock on every OS. The cali repo is private, so the
    # job needs a CALI_REPO_TOKEN secret that can read it; without one it
    # says so and passes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      HAS_CALI_TOKEN: ${{ secrets.CALI_REPO_TOKEN != '' }}
    steps:
      - name: No CALI_REPO_TOKEN, no smoke test
        if: env.HAS_CALI_TOKEN != 'true'
        run: echo "::notice::CALI_REPO_TOKEN is not set; skipping the cali smoke test"
      - uses: actions/checkout@v4
        if: env.HAS_CALI_TOKEN == 'true'
      - uses: actions/checkout@v4
        if: env.HAS_CALI_TOKEN == 'true'
        with:
          repository: rojcarranza/cali
          token: ${{ secrets.CALI_REPO_TOKEN }}
          path: cali-src
      - uses: actions/setup-go@v5
        if: env.HAS_CALI_TOKEN == 'true'
        with:
          go-version-file: cali-src/go.mod
      - uses: actions/setup-python@v5
        if: env.HAS_CALI_TOKEN == 'true'
        with:
          python-version: "3.12"
      - name: install.py installs everything into a scratch home
        if: env.HAS_CALI_TOKEN == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # cali reads this repo with it
          token: placeholder   # a GitHub login, so the MCP server is registered
        run: |
          base="$RUNNER_TEMP"; command -v cygpath >/dev/null && base="$(cygpath -m "$RUNNER_TEMP")"
          # ~/.local/bin of the scratch home: install.py looks there, so PATH
          # (colon-separated, which a C:/ path would break) stays as it is.
          mkdir -p "$base/home/.local/bin"
          (cd cali-src && CGO_ENABLED=0 go build -o "$base/home/.local/bin/cali$(go env GOEXE)" ./cmd/cali)
          export HOME="$base/home" USERPROFILE="$base/home"
          export CALI_CONFIG_DIR="$base/cali/config" CALI_DATA_DIR="$base/cali/data" CALI_CACHE_DIR="$base/cali/cache"
          python install.py --skills-only
          # The committed lock is complete and no own skill's tree is behind HEAD.
          "$HOME/.local/bin/cali$(go env GOEXE)" sync -g --manifest cali.yaml --frozen
          for d in skills/*/; do
            n=$(basename "$d")
            test -f "$HOME/.claude/skills/$n/SKILL.md"
            test -f "$HOME/.copilot/skills/$n/SKILL.md"
          done
          test -f "$HOME/.claude/skills/code-tour/SKILL.md"
          test -f "$HOME/.copilot/skills/caveman/SKILL.md"
          test ! -e "$HOME/.claude/skills/caveman"   # copilot-only stays out of Claude
          test -f "$HOME/.copilot/instructions/personal.instructions.md"
          test -f "$HOME/.claude/rules/personal.md"
          grep -q github-mcp-server "$HOME/.claude.json"
          grep -q github-mcp-server "$HOME/.copilot/mcp-config.json"
          ls "$HOME/.claude/skills" "$HOME/.copilot/skills"

  discoverable:
    # What `npx skills add rojcarranza/agent-skills` (skills.sh) will see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: skills CLI finds every skill
        run: |
          expected=$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)
          # NO_COLOR, then strip any ANSI codes left: the CLI colors skill names in CI.
          NO_COLOR=1 npx -y skills add . --list > raw.txt 2>&1 || { cat raw.txt; exit 1; }
          sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' raw.txt > list.txt
          cat list.txt
          for d in skills/*/; do
            name=$(basename "$d")
            # Match the CLI's header line for the skill (box-drawing prefix, then
            # the name alone): a substring or a mention inside another skill's
            # description, e.g. "use roj-code-review-pr instead", must not pass.
            grep -qE "^[^a-zA-Z0-9]*${name}[[:space:]]*$" list.txt \
              || { echo "::error::$name not discovered"; exit 1; }
          done
          echo "all $expected skills discovered"
