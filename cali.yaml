# Every skill install.py installs, through Cali. Copilot is the work agent, so
# skills default to [copilot]; only roj-idea-to-project also targets Claude
# (https://github.com/rojcarranza/cali). install.py runs
# `cali sync -g --manifest <this file>`; cali.lock next to it pins each skill
# to a tree (and community skills to a commit). Community refs are full commit SHAs: a version bump
# is a reviewed diff. Edit here, then re-run install.py.
version: 1
targets: [claude, copilot]
skills:
  # Own skills, from this clone at its checked-out HEAD. cali.lock pins the
  # tree; `cali update -g --manifest cali.yaml --apply` moves it.
  roj-code-review-pr:
    source: .//skills/roj-code-review-pr
    targets: [copilot]
  roj-explain-feature-changes:
    source: .//skills/roj-explain-feature-changes
    targets: [copilot]
